# sky-eye example config. Relative paths resolve against this file's folder.
source:
  type: file            # file | capture | stream | go2rtc
  path: samples/drone.mp4
  device: 0             # type: capture - capture device index (HDMI capture card, webcam)
  # type: stream - rtsp, rtsps, rtmp, rtmps, udp, http or https URL (srt: use go2rtc)
  #   url: rtsp://192.168.1.20:8554/live
  # type: go2rtc - a stream of a local go2rtc server, read from its RTSP output
  #   go2rtc:
  #     name: drone
  #     rtsp_base: rtsp://127.0.0.1:8554
  realtime: true
  loop: false

detector:
  type: rfdetr
  size: small           # nano | small | medium
  weights: null         # null = COCO-pretrained
  input_size: 512
  confidence: 0.4
  device: cuda          # cuda | cpu
  classes: [truck]

tracker:
  confirm_hits: 3
  confirm_window: 5
  lost_timeout_s: 2.0

evidence:
  data_dir: data
  clip_before_s: 3
  clip_after_s: 5
  snapshot_window_s: 2
  max_disk_gb: 20

alerts:
  cooldown_s: 10        # trucks seen within this many seconds of the last alert are batched
  desktop: true         # Windows toast + beep on the machine running the engine
  # Telegram needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env
  # telegram:
  #   enabled: true
  #   dashboard_url: http://192.168.1.10:8000
  # MQTT password (optional, used only with a username) is MQTT_PASSWORD in .env
  # mqtt:
  #   enabled: true
  #   host: 127.0.0.1
  #   port: 1883
  #   topic: sky-eye/events
  #   username: null
  #   tls: false

api:
  host: 0.0.0.0
  port: 8000
  auth:
    mode: none          # none | token (token needs SKYEYE_API_TOKEN in .env/env)
  stream_fps: 15
  stream_max_width: 1280
