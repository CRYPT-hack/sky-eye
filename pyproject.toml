[project]
name = "sky-eye"
version = "0.1.0"
description = "Drone truck-detection engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rfdetr~=1.11.2",
    "supervision~=0.31.4",
    "opencv-python>=4.10,<6",
    "av~=19.0",
    "fastapi~=0.162",
    "uvicorn[standard]~=0.54",
    "pydantic~=2.14",
    "pyyaml~=6.0",
    "numpy>=2.0",
    "torch",
    "trackers~=2.7",
    "httpx~=0.28",
    "plyer~=2.1",
    "paho-mqtt~=2.2",
    "pymavlink~=2.4",
    "pyserial~=3.5",
]

[dependency-groups]
dev = [
    "pytest~=9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
markers = [
    "gpu: needs CUDA and model download",
    "dashboard: needs the built website (cd dashboard && npm ci && npm run build)",
]
addopts = "-m 'not gpu and not dashboard'"
